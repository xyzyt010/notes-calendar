name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  create-release:
    name: Create release draft
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches Cargo.toml version
        run: |
          VER=$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "([^"]+)".*/\1/')
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VER" != "$TAG" ]; then
            echo "Cargo.toml version ($VER) does not match tag ($TAG)"
            exit 1
          fi
      - name: Create release draft
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: false
          generate_release_notes: true

  build:
    name: ${{ matrix.display }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Linux gnu (Ubuntu 22.04 baseline: glibc >= 2.35) ---
          - display: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bin_ext: ""
          - display: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bin_ext: ""
          # --- Windows ---
          - display: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_ext: .exe
          - display: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bin_ext: .exe
          # --- macOS (arm64 M1+ only; Intel retired) ---
          - display: macos-aarch64
            os: macos-26
            target: aarch64-apple-darwin
            bin_ext: ""
            mac_arch: arm64
          # --- Android (debug APK, arm64; signed in user's CI secrets when configured) ---
          - display: android-aarch64
            os: ubuntu-24.04
            target: aarch64-linux-android
            bin_ext: ""
            use_android: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux' && !matrix.use_android
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libudev-dev libinput-dev libgbm-dev libfontconfig-dev libseat-dev libwayland-dev libgl1-mesa-dev libglx-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Install cargo-apk2
        if: matrix.use_android
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-apk2@1.5.0

      - name: Build (desktop)
        if: ${{ !matrix.use_android }}
        shell: bash
        run: |
          set -e
          cargo build --release --locked --target ${{ matrix.target }} --workspace
          mkdir -p dist
          for app in notes calendar; do
            bin="target/${{ matrix.target }}/release/${app}${{ matrix.bin_ext }}"
            echo "built: $bin"
            cp "$bin" "dist/${app}-${{ github.ref_name }}-${{ matrix.display }}${{ matrix.bin_ext }}"
          done

      # NOTE: cargo-apk2 1.5.0 panics AFTER producing + signing the APK with
      # "Bin is not compatible with Cdylib" (non-fatal artifact-resolver bug in
      # cargo-subcommand-0.12.0). The APKs are verified by apk2's own alignment +
      # signature checks before the panic. We tolerate that one non-zero exit and
      # verify the produced APKs instead — anything else fails loudly.
      - name: Build Android APKs (debug keystore)
        if: matrix.use_android
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/27.3.13750724
          ANDROID_NDK: /usr/local/lib/android/sdk/ndk/27.3.13750724
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.3.13750724
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          ls "$ANDROID_HOME/ndk" || true
          mkdir -p dist/apks
          for app in notes calendar; do
            cargo apk2 build --target ${{ matrix.target }} -p $app \
              || echo "::warning::apk2 exited non-zero for $app (expected artifact-resolver panic after signing). Verifying produced APK instead."
          done
          find target -path '*/apk/*.apk' -type f -exec cp {} dist/apks/ \;
          ls -la dist/apks
          COUNT=$(find dist/apks -name '*.apk' | wc -l)
          if [ "$COUNT" -lt 2 ]; then
            echo "ERROR: expected 2 APKs, found $COUNT"
            find target -name '*.apk' -exec ls -la {} \;
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.display }}
          path: dist/

  publish:
    name: Publish release
    needs: [create-release, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Collect checksums
        run: |
          cd dist
          find . -type f -exec sha256sum {} \; > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/*
      - name: Upload release files
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          fail_on_unmatched_files: false
