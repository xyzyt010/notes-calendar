[package]
name = "suite-web"
description = "yellod suite web — efficient Rust backend serving notes+calendar web apps, with JWT auth."
version = "1.0.0"
edition = "2021"
rust-version = "1.78"
license = "MIT"
repository = "https://github.com/xyzyt010/notes-calendar"

[dependencies]
ycore = { path = "../../crates/ycore" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
anyhow = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled", "chrono", "uuid", "backup"] }
axum = { version = "0.8", features = ["json", "macros", "query", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "compression-gzip", "fs"] }
bcrypt = "0.17"
getrandom = "0.2"
base64 = "0.22"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing = "0.1"
http-body-util = "0.1"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3
strip = "symbols"
