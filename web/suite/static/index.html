<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>yellod suite — Notes & Calendar</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root { --bg:#131314; --surface:#1b1c1d; --text:#e8eaed; --dim:#9aa0a6; --accent:#aecbfa; }
  * { box-sizing:border-box; margin:0; padding:0 }
  html,body { height:100%; background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,-apple-system,sans-serif; }
  .wrap { min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px; padding:24px; text-align:center; }
  h1 { font-size:32px; font-weight:600; letter-spacing:-0.5px }
  p { color:var(--dim); max-width:520px; line-height:1.55; font-size:15px }
  .cards { display:flex; gap:18px; flex-wrap:wrap; justify-content:center }
  a.card { text-decoration:none; background:var(--surface); border:1px solid #2b2c2e; border-radius:20px;
    padding:28px 36px; min-width:260px; transition:border-color .15s, transform .15s; display:flex; flex-direction:column; align-items:center; gap:14px; }
  a.card:hover { border-color:#3c3d40; transform:translateY(-2px) }
  .glyph { width:56px; height:56px; border-radius:16px; display:grid; place-items:center; background:#0b326e40; }
  .glyph svg { width:32px; height:32px; stroke:var(--accent); stroke-width:2; fill:none }
  .card h2 { font-size:19px; font-weight:600; color:var(--text) }
  .card span { color:var(--dim); font-size:13px }
  footer { color:#6f747b; font-size:12px }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>yellod suite</h1>
    <p style="margin-top:8px">Private, local-first notes & calendar — fast everywhere, yours forever.</p>
  </div>
  <div class="cards">
    <a class="card" href="/notes">
      <div class="glyph">
        <svg viewBox="0 0 24 24"><path d="M15 10v1M9 10v1"/><path d="M7.528 20.472a1.6 1.6 0 0 1 2.277 0l1.057 1.056a1.6 1.6 0 0 1 2.276 0l1.057-1.056a1.6 1.6 0 0 1 2.277 0l1.114 1.114a1.4 1.4 0 0 0 2.414-1V10a8 8 0 1 0-16 0v10.586a1.4 1.4 0 0 0 2.414 1z"/></svg>
      </div>
      <h2>Notes</h2>
      <span>Jot it down, find it fast</span>
    </a>
    <a class="card" href="/calendar">
      <div class="glyph">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      </div>
      <h2>Calendar</h2>
      <span>Your time, beautifully organised</span>
    </a>
  </div>
  <footer>yellod suite · notes.yellod.dpdns.org</footer>
</div>
</body>
</html>
