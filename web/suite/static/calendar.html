<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Calendar — yellod suite</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root {
    --bg:#131314; --surface:#1b1c1d; --surface-2:#232425; --surface-3:#2b2c2e;
    --border:#2b2c2e; --border-strong:#3c3d40;
    --text:#e8eaed; --text-dim:#9aa0a6; --text-faint:#6f747b;
    --accent:#aecbfa; --accent-soft:#aecbfa29; --on-accent:#0b326e;
    --red:#ea4335; --shadow:#00000060;
    --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:24px;
  }
  * { box-sizing:border-box; margin:0; padding:0 }
  html,body { height:100% }
  body { background:var(--bg); color:var(--text); font-family:'Inter',system-ui,sans-serif; overflow:hidden; }
  button { font-family:inherit; cursor:pointer; border:none; background:none; color:inherit }
  input,textarea,select { font-family:inherit; color:inherit; }

  /* ---------- Login ---------- */
  #login { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:radial-gradient(900px 500px at 50% -10%, #0b326e33 0%, transparent 60%), var(--bg); z-index:10; }
  .login-card { width:380px; max-width:90vw; background:var(--surface); border:1px solid var(--border-strong); border-radius:var(--r-lg); padding:36px 34px; box-shadow:0 30px 80px #00000080; text-align:center; }
  .login-card svg { width:52px; height:52px; stroke:var(--accent); stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round; margin-bottom:14px; }
  .login-card h1 { font-size:24px; font-weight:600; }
  .login-card p { color:var(--text-dim); font-size:13px; margin:6px 0 24px; }
  .login-card input { width:100%; height:44px; background:var(--surface-2); border:1px solid transparent; border-radius:var(--r-md); padding:0 14px; font-size:14.5px; outline:none; margin-bottom:12px; }
  .login-card input:focus { border-color:var(--accent); }
  .login-card button { width:100%; height:44px; background:var(--accent); color:var(--on-accent); border-radius:var(--r-md); font-size:14.5px; font-weight:700; }
  .login-err { color:#f2b8b5; font-size:12.5px; min-height:18px; margin-top:10px; }

  /* ---------- App layout ---------- */
  #app { display:none; height:100%; flex-direction:column; }
  .topbar { height:64px; flex:0 0 64px; display:flex; align-items:center; gap:6px; padding:0 12px 0 8px; border-bottom:1px solid var(--border); }
  .topbar .spacer { flex:1 }
  .iconbtn { width:40px; height:40px; border-radius:50%; display:grid; place-items:center; transition:background .13s; }
  .iconbtn:hover { background:var(--surface-2); }
  .iconbtn svg { width:19px; height:19px; stroke:var(--text-dim); stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .logo { display:flex; align-items:center; gap:9px; padding:0 8px; user-select:none; }
  .logo svg { width:25px; height:25px; stroke:var(--accent); stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .logo span { font-size:19px; font-weight:600; letter-spacing:-0.2px; }
  .today-btn { height:34px; padding:0 18px; border-radius:17px; background:var(--surface-2); font-size:13px; font-weight:600; transition:background .13s; }
  .today-btn:hover { background:var(--surface-3); }
  .date-title { font-size:18px; font-weight:600; padding:0 8px; min-width:170px; }
  .switcher { display:flex; gap:2px; background:var(--surface-2); border-radius:19px; padding:4px; }
  .sw-btn { height:30px; padding:0 14px; border-radius:15px; font-size:12px; font-weight:600; color:var(--text-dim); transition:background .13s, color .13s; }
  .sw-btn.active { background:var(--surface); color:var(--accent); box-shadow:0 1px 4px #00000040; }
  .create-btn { height:38px; padding:0 18px 0 14px; border-radius:19px; background:var(--accent); color:var(--on-accent); font-size:13px; font-weight:700; display:flex; align-items:center; gap:7px; transition:filter .13s; }
  .create-btn:hover { filter:brightness(1.08); }
  .create-btn svg { width:17px; height:17px; stroke:var(--on-accent); stroke-width:2.5; fill:none; stroke-linecap:round; }

  .main { flex:1; display:flex; min-height:0; }
  .sidebar { flex:0 0 264px; border-right:1px solid var(--border); padding:12px; overflow-y:auto; display:flex; flex-direction:column; gap:4px; }
  .mini { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); padding:10px 10px 12px; margin-bottom:8px; }
  .mini-head { display:flex; align-items:center; height:30px; }
  .mini-head span { flex:1; font-size:13px; font-weight:700; }
  .mini-nav { width:26px; height:26px; border-radius:50%; display:grid; place-items:center; }
  .mini-nav:hover { background:var(--surface-2); }
  .mini-nav svg { width:14px; height:14px; stroke:var(--text-dim); stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .mini-wd { display:flex; margin:2px 0 2px; }
  .mini-wd span { width:34px; text-align:center; font-size:9.5px; font-weight:700; color:var(--text-faint); }
  .mini-grid { display:grid; grid-template-columns:repeat(7, 34px); gap:0; }
  .mini-day { width:34px; height:26px; border-radius:13px; display:grid; place-items:center; font-size:11px; cursor:pointer; position:relative; }
  .mini-day:hover { background:var(--surface-2); }
  .mini-day.today { background:var(--accent); color:var(--on-accent); font-weight:700; }
  .mini-day.selected { background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .mini-day.has-events::after { content:''; position:absolute; bottom:2px; left:50%; transform:translateX(-50%); width:3px; height:3px; border-radius:50%; background:var(--text-faint); }
  .mini-day.today.has-events::after { background:var(--on-accent); }

  .side-header { display:flex; align-items:center; height:28px; padding:0 8px; margin-top:2px; }
  .side-header span { font-size:10px; font-weight:700; letter-spacing:1.1px; color:var(--text-faint); }
  .cal-row { display:flex; align-items:center; gap:9px; height:34px; border-radius:var(--r-md); padding:0 8px; cursor:pointer; }
  .cal-row:hover { background:var(--surface-2); }
  .cal-check { width:15px; height:15px; border-radius:4px; border:1.5px solid var(--border-strong); display:grid; place-items:center; flex:0 0 auto; }
  .cal-check.on { background:var(--accent); border-color:var(--accent); }
  .cal-check.on svg { width:11px; height:11px; stroke:var(--on-accent); stroke-width:2.5; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .cal-dot { width:9px; height:9px; border-radius:50%; flex:0 0 auto; }
  .cal-row .name { flex:1; font-size:12.5px; }
  .cal-row .count { font-size:11px; color:var(--text-faint); }

  .upcoming { flex:1; overflow-y:auto; }
  .up-item { display:flex; gap:9px; padding:7px 8px; border-radius:var(--r-md); cursor:pointer; }
  .up-item:hover { background:var(--surface-2); }
  .up-bar { width:3px; border-radius:2px; flex:0 0 auto; background:var(--accent); }
  .up-title { font-size:12px; font-weight:600; }
  .up-time { font-size:10px; color:var(--text-faint); }
  .side-note { padding:8px 10px; color:var(--text-faint); font-size:10.5px; border-top:1px solid var(--border); line-height:1.5; }

  /* ---------- Month grid ---------- */
  .content { flex:1; display:flex; flex-direction:column; min-width:0; }
  .weekday-row { display:flex; border-bottom:1px solid var(--border); flex:0 0 30px; }
  .weekday-row span { flex:1; text-align:center; font-size:11px; font-weight:700; letter-spacing:0.8px; color:var(--text-faint); padding-top:6px; }
  .month-grid { flex:1; display:grid; grid-template-columns:repeat(7, 1fr); grid-template-rows:repeat(6, 1fr); min-height:0; }
  .day-cell { border-right:1px solid var(--border); border-bottom:1px solid var(--border); padding:5px 7px; display:flex; flex-direction:column; gap:3px; cursor:pointer; overflow:hidden; }
  .day-cell:hover { background:#1e1f20; }
  .day-cell.outside { opacity:0.35; }
  .day-cell.today .daynum { color:var(--accent); font-weight:700; }
  .day-cell.selected { background:var(--accent-soft); }
  .daynum { font-size:12px; font-weight:500; }
  .chip { font-size:10px; font-weight:600; border-radius:4px; padding:2px 6px; color:#101418; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; }
  .chip:hover { filter:brightness(1.15); }
  .more { font-size:9.5px; color:var(--text-dim); font-weight:600; padding-left:2px; }

  /* ---------- Day view (time grid) ---------- */
  .day-view { flex:1; overflow-y:auto; position:relative; }
  .allday-strip { min-height:36px; display:flex; align-items:center; gap:6px; padding:5px 8px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .allday-strip .lbl { font-size:10px; font-weight:700; color:var(--text-faint); letter-spacing:1px; }
  .time-grid { display:flex; }
  .gutter { flex:0 0 56px; border-right:1px solid var(--border); }
  .gutter-row { height:52px; position:relative; }
  .gutter-row span { position:absolute; top:-7px; right:8px; font-size:9.5px; color:var(--text-faint); }
  .time-col { flex:1; position:relative; }
  .time-row { height:52px; border-bottom:1px solid var(--border); opacity:0.55; }
  .time-row.half { opacity:0.18; }
  .event-block { position:absolute; left:4px; right:4px; border-radius:7px; padding:3px 7px; font-size:11px; font-weight:600; color:#101418; overflow:hidden; cursor:pointer; border-left:3px solid rgba(0,0,0,0.25); }
  .now-line { position:absolute; left:0; right:0; height:2px; background:var(--red); z-index:2; }
  .now-dot { position:absolute; left:-5px; top:-4px; width:9px; height:9px; border-radius:50%; background:var(--red); z-index:2; }

  /* ---------- Event dialog ---------- */
  .modal { position:fixed; inset:0; background:#00000099; display:none; align-items:center; justify-content:center; z-index:20; }
  .modal.open { display:flex; }
  .modal-card { width:500px; max-width:92vw; max-height:92vh; background:var(--surface); border:1px solid var(--border-strong); border-radius:var(--r-lg); box-shadow:0 30px 80px #00000090; overflow-y:auto; padding:22px 24px 18px; }
  .modal-head { display:flex; align-items:center; margin-bottom:14px; }
  .modal-head h2 { font-size:16px; font-weight:600; flex:1; }
  .modal-close { width:34px; height:34px; border-radius:50%; display:grid; place-items:center; }
  .modal-close:hover { background:var(--surface-2); }
  .modal-close svg { width:16px; height:16px; stroke:var(--text-dim); stroke-width:2; fill:none; stroke-linecap:round; }
  .modal-title { width:100%; background:transparent; border:none; outline:none; font-size:21px; font-weight:600; padding:4px 0; border-bottom:1px solid var(--border); margin-bottom:14px; }
  .modal-title::placeholder { color:var(--text-faint); }
  .modal-row { display:flex; align-items:center; gap:10px; padding:7px 0; }
  .modal-row label { width:70px; font-size:10.5px; font-weight:700; letter-spacing:0.8px; color:var(--text-faint); }
  .modal-row input, .modal-row select { flex:1; height:36px; background:var(--surface-2); border:1px solid transparent; border-radius:var(--r-md); padding:0 12px; font-size:13px; outline:none; }
  .modal-row input:focus, .modal-row select:focus { border-color:var(--accent); }
  .modal-actions { display:flex; gap:8px; margin-top:14px; }
  .btn { height:38px; padding:0 18px; border-radius:var(--r-md); font-size:13px; font-weight:600; }
  .btn-ghost { background:var(--surface-2); }
  .btn-primary { background:var(--accent); color:var(--on-accent); font-weight:700; }
  .btn-danger { background:var(--danger,#f2b8b5); color:#4c0100; }
  .spacer { flex:1; }
  .swatches { display:flex; gap:8px; }
  .swatch { width:24px; height:24px; border-radius:50%; cursor:pointer; border:2px solid transparent; }
  .swatch.on { border-color:var(--text); }

  .statusbar { flex:0 0 26px; display:flex; align-items:center; gap:8px; padding:0 16px; border-top:1px solid var(--border); font-size:10.5px; color:var(--text-faint); }
  .statusbar .right { margin-left:auto; }

  ::-webkit-scrollbar { width:10px; height:10px }
  ::-webkit-scrollbar-thumb { background:var(--surface-3); border-radius:5px }
  ::-webkit-scrollbar-track { background:transparent }

  @media (max-width: 900px) {
    .sidebar { display:none; }
    .logo span, .date-title { display:none; }
  }
</style>
</head>
<body>

<div id="login">
  <form class="login-card" id="loginForm">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    <h1>Calendar</h1>
    <p>Sign in to your private calendar</p>
    <input type="text" id="username" placeholder="Username" value="admin" autocomplete="username" autofocus>
    <input type="password" id="password" placeholder="Password" autocomplete="current-password">
    <button type="submit">Sign in</button>
    <div class="login-err" id="loginErr"></div>
  </form>
</div>

<div id="app">
  <div class="topbar">
    <button class="iconbtn" id="menuBtn" title="Toggle sidebar"><svg viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg></button>
    <div class="logo">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>Calendar</span>
    </div>
    <button class="today-btn" id="todayBtn">Today</button>
    <button class="iconbtn" id="prevBtn"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
    <button class="iconbtn" id="nextBtn"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>
    <div class="date-title" id="dateTitle">November 2026</div>
    <div class="spacer"></div>
    <div class="switcher" id="switcher">
      <button class="sw-btn" data-view="0">Day</button>
      <button class="sw-btn" data-view="1">Week</button>
      <button class="sw-btn active" data-view="2">Month</button>
      <button class="sw-btn" data-view="3">Year</button>
    </div>
    <div style="width:8px"></div>
    <button class="create-btn" id="createBtn"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Create</button>
    <button class="iconbtn" id="logoutBtn" title="Sign out"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
  </div>

  <div class="main">
    <div class="sidebar" id="sidebar">
      <div class="mini">
        <div class="mini-head">
          <span id="miniTitle">November 2026</span>
          <button class="mini-nav" id="miniPrev"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
          <button class="mini-nav" id="miniNext"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>
        </div>
        <div class="mini-wd"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
        <div class="mini-grid" id="miniGrid"></div>
      </div>

      <div class="side-header"><span>MY CALENDARS</span></div>
      <div id="calList"></div>

      <div class="side-header" style="margin-top:6px"><span>UPCOMING</span></div>
      <div class="upcoming" id="upcomingList"></div>
      <div class="side-note">Local-first · Private · All your calendars</div>
    </div>

    <div class="content">
      <div class="weekday-row" id="weekdayRow">
        <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
      </div>
      <div class="month-grid" id="monthView"></div>
      <div class="day-view" id="dayView" style="display:none"></div>
    </div>
  </div>

  <div class="statusbar">
    <span>Local-first · Private</span>
    <span class="right" id="statusCount">0 events</span>
  </div>
</div>

<!-- ======= EVENT MODAL ======= -->
<div class="modal" id="eventModal">
  <div class="modal-card">
    <div class="modal-head">
      <h2 id="modalTitle">New event</h2>
      <button class="modal-close" id="closeModal"><svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>
    </div>
    <input class="modal-title" id="evTitle" placeholder="Event title" autocomplete="off">
    <div class="modal-row"><label>DATE</label><input type="date" id="evDate"></div>
    <div class="modal-row"><label>START</label><input type="time" id="evStart" value="09:00"></div>
    <div class="modal-row"><label>END</label><input type="time" id="evEnd" value="10:00"></div>
    <div class="modal-row"><label>ALL DAY</label><input type="checkbox" id="evAllDay" style="flex:0 0 auto; width:18px; height:18px;"></div>
    <div class="modal-row"><label>CALENDAR</label><select id="evCalendar"></select></div>
    <div class="modal-row"><label>COLOR</label>
      <div class="swatches" id="evColors"></div>
    </div>
    <div class="modal-row"><label>LOCATION</label><input type="text" id="evLocation" placeholder="Optional"></div>
    <div class="modal-row"><label>NOTES</label><input type="text" id="evNotes" placeholder="Optional"></div>
    <div class="modal-actions">
      <button class="btn btn-danger" id="evDelete" style="display:none">Delete</button>
      <div class="spacer"></div>
      <button class="btn btn-ghost" id="evCancel">Cancel</button>
      <button class="btn btn-primary" id="evSave">Create</button>
    </div>
  </div>
</div>

<script>
'use strict';

// ============================== state ==============================
const state = {
  cursor: new Date(),          // current day being viewed
  view: 2,                     // 0 day · 1 week · 2 month · 3 year
  calendars: [],
  events: [],
  selectedId: null,
  editingId: null,
  selectedCalendarId: null,
  upcoming: [],
};

const COLOR_CHOICES = ['#aecbfa','#f28b82','#81c995','#fdd663','#d7aefb','#78d9ec','#fcad70'];

const $ = (s) => document.querySelector(s);

// ============================== api ==============================
const api = async (path, opts = {}) => {
  const resp = await fetch(path, { headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) }, ...opts });
  if (resp.status === 401) { showLogin(); throw new Error('unauthorized'); }
  return resp;
};
const getJ = async (p) => (await api(p)).json();

// ============================== auth ==============================
const loginEl = $('#login'), appEl = $('#app');
function showLogin() { loginEl.style.display = 'flex'; appEl.style.display = 'none'; }
function showApp() { loginEl.style.display = 'none'; appEl.style.display = 'flex'; }

$('#loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = $('#loginErr'); err.textContent = '';
  try {
    const r = await (await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: $('#username').value.trim(), password: $('#password').value }) })).json();
    if (r.ok) boot(); else err.textContent = 'Invalid credentials';
  } catch { err.textContent = 'Invalid credentials'; }
});
$('#logoutBtn').addEventListener('click', async () => { await api('/api/auth/logout', { method: 'POST' }); showLogin(); });

// ============================== helpers ==============================
const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const startOfMonth = (d) => new Date(d.getFullYear(), d.getMonth(), 1);
const monthName = (d) => d.toLocaleDateString([], { month: 'long', year: 'numeric' });
const pad = (n) => String(n).padStart(2, '0');
const toISODate = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fmtTime = (d) => d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
const fmtTimeShort = (d) => d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }).replace(' ', ' ');
const relDay = (d) => {
  const today = startOfDay(new Date());
  const target = startOfDay(d);
  const diff = Math.round((target - today) / 86400000);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Tomorrow';
  if (diff === -1) return 'Yesterday';
  return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
};
const weekdayIndex = (d) => (d.getDay() + 6) % 7; // Mon=0

function eventsIntersect(e, day) {
  const s = new Date(e.start), en = new Date(e.end);
  if (e.all_day) {
    return startOfDay(s).getTime() <= startOfDay(day).getTime() && startOfDay(en).getTime() >= startOfDay(day).getTime();
  }
  return s < addDays(startOfDay(day), 1) && en > startOfDay(day);
}

// ============================== data ==============================
async function loadAll() {
  const [calendars, events] = await Promise.all([
    getJ('/api/calendars'),
    getJ(`/api/events?from=${encodeURIComponent(new Date(Date.now() - 30*86400000).toISOString())}&to=${encodeURIComponent(new Date(Date.now() + 120*86400000).toISOString())}`),
  ]);
  state.calendars = calendars;
  state.events = events;
  state.selectedCalendarId = state.selectedCalendarId || (calendars[0] && calendars[0].id);
  renderSidebar();
  render();
}

function visibleEvents() {
  return state.events.filter(e => {
    const cal = state.calendars.find(c => c.id === e.calendar_id);
    return !cal || cal.visible;
  });
}

// ============================== sidebar ==============================
function renderSidebar() {
  const list = $('#calList');
  list.innerHTML = '';
  for (const c of state.calendars) {
    const count = state.events.filter(e => e.calendar_id === c.id).length;
    const row = document.createElement('div');
    row.className = 'cal-row';
    row.innerHTML = `<div class="cal-check ${c.visible ? 'on' : ''}">${c.visible ? '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 10"/></svg>' : ''}</div><span class="cal-dot" style="background:${c.color}"></span><span class="name">${escapeHtml(c.name)}</span><span class="count">${count}</span>`;
    row.addEventListener('click', async () => {
      // toggle visibility (locally)
      c.visible = !c.visible;
      renderSidebar(); render();
      try { await api(`/api/calendars/${c.id}`, { method: 'PATCH', body: JSON.stringify({ visible: c.visible }) }); } catch {}
    });
    list.appendChild(row);
  }
  renderUpcoming();
  renderMiniMonth();
}

function renderUpcoming() {
  const upcoming = state.events
    .filter(e => new Date(e.end) > new Date())
    .sort((a, b) => new Date(a.start) - new Date(b.start))
    .slice(0, 6);
  const list = $('#upcomingList');
  list.innerHTML = '';
  if (upcoming.length === 0) {
    list.innerHTML = '<div class="side-note" style="border:none">Nothing upcoming yet.</div>';
    return;
  }
  for (const e of upcoming) {
    const d = document.createElement('div');
    d.className = 'up-item';
    const s = new Date(e.start);
    const time = e.all_day ? 'All day · ' + relDay(s) : relDay(s) + ', ' + fmtTimeShort(s);
    d.innerHTML = `<div class="up-bar" style="background:${e.color || '#aecbfa'}"></div><div><div class="up-title">${escapeHtml(e.title)}</div><div class="up-time">${time}</div></div>`;
    d.addEventListener('click', () => openEditor(e.id));
    list.appendChild(d);
  }
}

function renderMiniMonth() {
  const grid = $('#miniGrid');
  grid.innerHTML = '';
  const cur = state.cursor;
  $('#miniTitle').textContent = monthName(cur);
  const first = startOfMonth(cur);
  const lead = weekdayIndex(first);
  const today = startOfDay(new Date());
  const cells = 42;
  for (let i = 0; i < cells; i++) {
    const day = i - lead + 1;
    const cell = document.createElement('div');
    cell.className = 'mini-day';
    if (day < 1 || day > new Date(cur.getFullYear(), cur.getMonth() + 1, 0).getDate()) {
      cell.textContent = '';
      cell.style.pointerEvents = 'none';
    } else {
      const d = new Date(cur.getFullYear(), cur.getMonth(), day);
      cell.textContent = day;
      if (sameDay(d, today)) cell.classList.add('today');
      else if (sameDay(d, cur)) cell.classList.add('selected');
      if (visibleEvents().some(e => eventsIntersect(e, d))) cell.classList.add('has-events');
      cell.addEventListener('click', () => { state.cursor = d; state.view = 2; syncSwitcher(); render(); });
    }
    grid.appendChild(cell);
  }
}

// ============================== month view ==============================
function renderMonthGrid() {
  const grid = $('#monthView');
  grid.innerHTML = '';
  const cur = state.cursor;
  const first = startOfMonth(cur);
  const lead = weekdayIndex(first);
  const today = startOfDay(new Date());
  const daysInMonth = new Date(cur.getFullYear(), cur.getMonth() + 1, 0).getDate();
  const prevMonthDays = new Date(cur.getFullYear(), cur.getMonth(), 0).getDate();

  for (let i = 0; i < 42; i++) {
    const cell = document.createElement('div');
    cell.className = 'day-cell';
    let dayNum, cellDate, outside = false;
    if (i < lead) {
      dayNum = prevMonthDays - lead + i + 1;
      cellDate = new Date(cur.getFullYear(), cur.getMonth() - 1, dayNum);
      outside = true;
    } else if (i >= lead + daysInMonth) {
      dayNum = i - lead - daysInMonth + 1;
      cellDate = new Date(cur.getFullYear(), cur.getMonth() + 1, dayNum);
      outside = true;
    } else {
      dayNum = i - lead + 1;
      cellDate = new Date(cur.getFullYear(), cur.getMonth(), dayNum);
    }
    cell.classList.toggle('outside', outside);
    if (sameDay(cellDate, today)) cell.classList.add('today');
    if (sameDay(cellDate, cur)) cell.classList.add('selected');

    const num = document.createElement('div');
    num.className = 'daynum';
    num.textContent = dayNum;
    cell.appendChild(num);

    const dayEvents = visibleEvents().filter(e => eventsIntersect(e, cellDate)).slice(0, 3);
    for (const e of dayEvents) {
      const chip = document.createElement('div');
      chip.className = 'chip';
      chip.style.background = e.color || '#aecbfa';
      chip.textContent = e.title;
      chip.addEventListener('click', (ev) => { ev.stopPropagation(); openEditor(e.id); });
      cell.appendChild(chip);
    }
    const totalCount = visibleEvents().filter(e => eventsIntersect(e, cellDate)).length;
    if (totalCount > 3) {
      const more = document.createElement('div');
      more.className = 'more';
      more.textContent = `+${totalCount - 3} more`;
      cell.appendChild(more);
    }
    cell.addEventListener('click', () => {
      state.cursor = cellDate;
      state.view = 0;
      syncSwitcher();
      $('#weekdayRow').style.display = 'none';
      render();
    });
    grid.appendChild(cell);
  }
  $('#statusCount').textContent = visibleEvents().length + ' events';
}

// ============================== day view (time grid) ==============================
function renderDayView() {
  const d = $('#dayView');
  d.innerHTML = '';
  const cur = state.cursor;
  $('#statusCount').textContent = visibleEvents().length + ' events';

  // all-day strip
  const allDay = visibleEvents().filter(e => e.all_day && eventsIntersect(e, cur));
  const strip = document.createElement('div');
  strip.className = 'allday-strip';
  strip.innerHTML = '<span class="lbl">ALL DAY</span>';
  for (const e of allDay) {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.style.background = e.color || '#aecbfa';
    chip.style.height = '26px';
    chip.style.display = 'inline-flex';
    chip.style.alignItems = 'center';
    chip.textContent = e.title;
    chip.addEventListener('click', () => openEditor(e.id));
    strip.appendChild(chip);
  }
  d.appendChild(strip);

  const grid = document.createElement('div');
  grid.className = 'time-grid';
  grid.innerHTML = '<div class="gutter">' + Array.from({ length: 24 }, (_, h) =>
    `<div class="gutter-row">${h === 0 ? '' : `<span>${h % 12 === 0 ? 12 : h % 12} ${h < 12 ? 'AM' : 'PM'}</span>`}</div>`
  ).join('') + '</div><div class="time-col">'
    + Array.from({ length: 24 }, () => '<div class="time-row"></div><div class="time-row half"></div>').join('')
    + '</div>';
  d.appendChild(grid);

  const col = grid.querySelector('.time-col');
  const timed = visibleEvents().filter(e => !e.all_day && eventsIntersect(e, cur));
  const hourHeight = 52;
  for (const e of timed) {
    const s = new Date(e.start), en = new Date(e.end);
    const startMin = (s.getHours() * 60 + s.getMinutes());
    const durMin = Math.max(15, (en - s) / 60000);
    const top = (startMin / 60) * hourHeight;
    const h = (durMin / 60) * hourHeight;
    const block = document.createElement('div');
    block.className = 'event-block';
    block.style.background = e.color || '#aecbfa';
    block.style.top = top + 'px';
    block.style.height = h + 'px';
    block.innerHTML = `<div>${escapeHtml(e.title)}</div><div style="font-weight:400; opacity:0.75; font-size:10px">${fmtTimeShort(s)}</div>`;
    block.addEventListener('click', () => openEditor(e.id));
    col.appendChild(block);
  }
  // now line if today
  const today = startOfDay(new Date());
  if (sameDay(cur, today)) {
    const now = new Date();
    const top = (now.getHours() * 60 + now.getMinutes()) / 60 * hourHeight;
    const line = document.createElement('div');
    line.className = 'now-line';
    line.style.top = top + 'px';
    const dot = document.createElement('div');
    dot.className = 'now-dot';
    dot.style.top = (top - 4) + 'px';
    col.appendChild(line); col.appendChild(dot);
  }
}

// ============================== year view ==============================
function renderYearView() {
  const grid = $('#monthView');
  grid.innerHTML = '';
  $('#monthView').style.gridTemplateColumns = 'repeat(4, 1fr)';
  $('#monthView').style.gridTemplateRows = 'repeat(3, 1fr)';
  $('#weekdayRow').style.display = 'none';
  const year = state.cursor.getFullYear();
  const today = startOfDay(new Date());
  for (let m = 0; m < 12; m++) {
    const mDate = new Date(year, m, 1);
    const cell = document.createElement('div');
    cell.style.cssText = 'border-right:1px solid var(--border); border-bottom:1px solid var(--border); padding:8px 10px; overflow:hidden; cursor:pointer;';
    cell.addEventListener('click', () => { state.cursor = new Date(year, m, 1); state.view = 2; syncSwitcher(); $('#weekdayRow').style.display = ''; render(); });
    const first = new Date(year, m, 1);
    const lead = weekdayIndex(first);
    const dim = new Date(year, m + 1, 0).getDate();
    let html = `<div style="font-size:13px;font-weight:700;color:${m === new Date().getMonth() && year === new Date().getFullYear() ? 'var(--accent)' : 'var(--text)'}; padding-bottom:4px">${first.toLocaleDateString([], { month: 'long' })}</div>`;
    html += '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:0;font-size:8px;color:var(--text-faint);font-weight:700"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>';
    html += '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:0">';
    for (let i = 0; i < 42; i++) {
      const day = i - lead + 1;
      if (day < 1 || day > dim) { html += '<span></span>'; continue; }
      const d = new Date(year, m, day);
      const hasEvents = visibleEvents().some(e => eventsIntersect(e, d));
      const isToday = sameDay(d, today);
      html += `<span style="font-size:10.5px;padding:2px 0;text-align:center;border-radius:8px;${isToday ? 'background:var(--accent);color:var(--on-accent);font-weight:700;' : ''}${hasEvents ? 'color:var(--accent);font-weight:600;' : ''}">${day}</span>`;
    }
    html += '</div>';
    cell.innerHTML = html;
    grid.appendChild(cell);
  }
  $('#statusCount').textContent = visibleEvents().length + ' events';
}

// ============================== render ==============================
function syncSwitcher() {
  document.querySelectorAll('.sw-btn').forEach(b => b.classList.toggle('active', Number(b.dataset.view) === state.view));
}

function render() {
  $('#dateTitle').textContent = state.view === 2 ? monthName(state.cursor)
    : state.view === 3 ? String(state.cursor.getFullYear())
    : state.cursor.toLocaleDateString([], { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

  $('#monthView').style.display = (state.view === 0 || state.view === 1) ? 'none' : 'grid';
  $('#dayView').style.display = state.view === 0 ? 'flex' : 'none';
  $('#weekdayRow').style.display = (state.view === 2 || state.view === 1) ? 'flex' : 'none';
  $('#monthView').style.gridTemplateColumns = 'repeat(7, 1fr)';
  $('#monthView').style.gridTemplateRows = 'repeat(6, 1fr)';

  if (state.view === 2) renderMonthGrid();
  else if (state.view === 0) renderDayView();
  else if (state.view === 3) renderYearView();
  else if (state.view === 1) renderMonthGrid(); // week uses month layout in web v1 (keeps it simple & efficient)
  renderMiniMonth();
  syncSwitcher();
}

// ============================== modal ==============================
const modal = $('#eventModal');
const evTitle = $('#evTitle'), evDate = $('#evDate'), evStart = $('#evStart'), evEnd = $('#evEnd'), evAllDay = $('#evAllDay'), evCalendar = $('#evCalendar'), evLocation = $('#evLocation'), evNotes = $('#evNotes');
let selectedColor = COLOR_CHOICES[0];

function populateCalendars() {
  evCalendar.innerHTML = state.calendars.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
  if (state.selectedCalendarId) evCalendar.value = state.selectedCalendarId;
}
function renderColorSwatches() {
  $('#evColors').innerHTML = COLOR_CHOICES.map(c =>
    `<div class="swatch ${c === selectedColor ? 'on' : ''}" data-color="${c}" style="background:${c}"></div>`
  ).join('');
  $('#evColors').querySelectorAll('.swatch').forEach(el => el.addEventListener('click', () => {
    selectedColor = el.dataset.color;
    renderColorSwatches();
  }));
}

function openEditor(id) {
  const e = state.events.find(x => x.id === id);
  state.editingId = id || null;
  populateCalendars();
  renderColorSwatches();
  $('#modalTitle').textContent = e ? 'Edit event' : 'New event';
  $('#evSave').textContent = e ? 'Save' : 'Create';
  $('#evDelete').style.display = e ? 'inline-flex' : 'none';
  if (e) {
    evTitle.value = e.title;
    const s = new Date(e.start), en = new Date(e.end);
    evDate.value = toISODate(s);
    evStart.value = `${pad(s.getHours())}:${pad(s.getMinutes())}`;
    evEnd.value = `${pad(en.getHours())}:${pad(en.getMinutes())}`;
    evAllDay.checked = !!e.all_day;
    evCalendar.value = e.calendar_id || (state.calendars[0] && state.calendars[0].id);
    evLocation.value = e.location || '';
    evNotes.value = e.notes || '';
    selectedColor = e.color || COLOR_CHOICES[0];
  } else {
    evTitle.value = '';
    evDate.value = toISODate(state.cursor);
    evStart.value = '09:00'; evEnd.value = '10:00';
    evAllDay.checked = false;
    evLocation.value = ''; evNotes.value = '';
    selectedColor = COLOR_CHOICES[0];
  }
  renderColorSwatches();
  modal.classList.add('open');
  evTitle.focus();
}

function closeModal() { modal.classList.remove('open'); }

async function saveEvent() {
  const title = evTitle.value.trim();
  if (!title) { evTitle.focus(); return; }
  const date = evDate.value;
  const start = `${date}T${evStart.value || '09:00'}:00Z`;
  const end = `${date}T${evEnd.value || '10:00'}:00Z`;
  const body = {
    title,
    start,
    end,
    all_day: evAllDay.checked,
    calendar_id: evCalendar.value,
    color: selectedColor,
    location: evLocation.value.trim() || null,
    notes: evNotes.value.trim() || undefined,
  };
  try {
    if (state.editingId) {
      await api(`/api/events/${state.editingId}`, { method: 'PUT', body: JSON.stringify(body) });
    } else {
      await api('/api/events', { method: 'POST', body: JSON.stringify(body) });
    }
    closeModal();
    await loadAll();
  } catch (err) {
    console.error(err);
  }
}

$('#createBtn').addEventListener('click', () => openEditor(null));
$('#closeModal').addEventListener('click', closeModal);
$('#evCancel').addEventListener('click', closeModal);
modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
$('#evSave').addEventListener('click', saveEvent);
$('#evDelete').addEventListener('click', async () => {
  if (!state.editingId) return;
  await api(`/api/events/${state.editingId}`, { method: 'DELETE' });
  closeModal();
  await loadAll();
});
$('#evAllDay').addEventListener('change', () => {
  evStart.disabled = evAllDay.checked;
  evEnd.disabled = evAllDay.checked;
});

// ============================== toolbar ==============================
$('#menuBtn').addEventListener('click', () => { const sb = $('#sidebar'); sb.style.display = sb.style.display === 'none' ? '' : 'none'; });
$('#todayBtn').addEventListener('click', () => { state.cursor = new Date(); render(); });
$('#prevBtn').addEventListener('click', () => { state.cursor = addDays(state.cursor, state.view === 2 ? -30 : (state.view === 3 ? -365 : -1)); render(); });
$('#nextBtn').addEventListener('click', () => { state.cursor = addDays(state.cursor, state.view === 2 ? 30 : (state.view === 3 ? 365 : 1)); render(); });
document.querySelectorAll('.sw-btn').forEach(b => b.addEventListener('click', () => { state.view = Number(b.dataset.view); render(); }));
$('#miniPrev').addEventListener('click', () => { state.cursor = new Date(state.cursor.getFullYear(), state.cursor.getMonth() - 1, 1); render(); });
$('#miniNext').addEventListener('click', () => { state.cursor = new Date(state.cursor.getFullYear(), state.cursor.getMonth() + 1, 1); render(); });

document.addEventListener('keydown', (e) => {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 'n') { e.preventDefault(); openEditor(null); }
  else if (e.key === 'Escape') closeModal();
});

function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ============================== boot ==============================
async function boot() {
  const me = await fetch('/api/auth/me');
  if (me.status !== 200) { showLogin(); return; }
  showApp();
  await loadAll();
}
boot();
</script>
