[package]
name = "calendar"
description = "Calendar — a fast, beautiful, local-first calendar for the yellod suite (day · week · month · year, reminders, recurrence)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ycore.workspace = true
slint.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
arboard = "3"
dirs = "6"
anyhow.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }

[build-dependencies]
slint-build = "1.18.1"

[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = "2.4"

[features]
default = []
skia = ["slint/renderer-skia"]

[lib]
crate-type = ["lib"]

[[bin]]
name = "calendar"
path = "src/main.rs"

[package.metadata.deb]
name = "calendar"
maintainer = "yellod <hello@yellod.dpdns.org>"
depends = "libfontconfig1, libgl1, libxkbcommon0"
section = "utils"
priority = "optional"
assets = [
    ["../../target/release/calendar", "/usr/bin/calendar", "755"],
    ["../../assets/calendar-icon.png", "/usr/share/pixmaps/yellod-calendar.png", "644"],
]

[package.metadata.generate-rpm]
name = "calendar"
assets = [
    { source = "../../target/release/calendar", dest = "/usr/bin/calendar", mode = "755" },
]

[package.metadata.android]
package = "app.yellod.calendar"
apk_name = "Calendar"
min_sdk_version = 24
target_sdk_version = 35

[package.metadata.android.application]
label = "Calendar"

[profile.dev.build-override]
opt-level = 3
